inherit_gem:
  decidim-dev: rubocop-decidim.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.4
  Exclude:
    - "development_app/**/*"
    - "spec/decidim_dummy_app/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"

Metrics/BlockLength:
  Exclude:
    - "lib/decidim/elections/vocdoni/component.rb"
    - "lib/decidim/elections/vocdoni/admin_engine.rb"
    - "spec/**/*"

# The Gemfile's `# rubocop:disable Bundler/DuplicatedGem` pair wraps a
# full if/else block that declares the same set of gems from either a
# local path or a git ref — the two branches are mutually exclusive but
# name the same gems. `disable-next-line` would only cover the `if`
# line and leave the else branch flagged, so the block-scoped
# disable/enable pair stays as the least-noisy option.
#
# `process.rb` wraps `record_census_validation!` in a disable pair for
# `Naming/MethodParameterName` + `Metrics/ParameterLists`: the six
# keyword args mirror the SaaS census-validation payload one-for-one,
# and `ok:` is the payload's own key. A trailing directive would blow
# past the line-length limit; splitting the args into a hash would hide
# what is a deliberate 1:1 shape.
Style/DirectiveScope:
  Exclude:
    - "Gemfile"
    - "app/models/decidim/elections/vocdoni/process.rb"
