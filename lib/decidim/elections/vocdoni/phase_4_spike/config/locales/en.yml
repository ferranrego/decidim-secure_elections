en:
  decidim:
    elections:
      censuses:
        vocdoni_secure:
          label: "Secure via Vocdoni"
          credentials_title: "Voter authentication"
          credentials_info: "Pick which identifier fields voters authenticate with. Each ballot is signed and verified in the browser; the Decidim server never sees a vote."
          credential_fields:
            email: "Email address"
            phone: "Phone number"
            member_number: "Member number"
            national_id: "National ID"
            name: "Full name"
            date_of_birth: "Date of birth"
          weighted_votes: "Weighted votes"
          weighted_votes_help: "Assign each voter a weight (default 1). Requires a per-voter weight column when the census is populated."
      admin:
        elections:
          dashboard:
            # Overrides the misleading upstream copy ("Edits can still be made
            # before publishing. Once published, you'll still be able to update
            # the description of the election.") for Vocdoni-backed elections,
            # where publish is irreversible and locks every editable field.
            vocdoni_subtitle_html: >
              <strong>This is the last step before writing the election to the blockchain.</strong>
              Publishing anchors the process, its questions and its census on the Vocdoni chain
              — none of it can be edited, moved or removed after that. Review everything below,
              then use the button in the sidebar to publish.
            publish_confirm_vocdoni: "Publish this election to the blockchain? This is irreversible: the process, its questions and its census will be anchored on chain and cannot be edited afterwards."
      vocdoni:
        booth:
          launcher:
            help_html: "Your ballot is signed and submitted in your browser. The Decidim server never sees a vote."
            enter: "Open the voting booth"
            chain_note_html: "Anchored on the Vocdoni chain <code>%{chain}</code>."
            not_ready: "This election is not yet ready to accept votes on the blockchain. Please try again in a few moments."
